<title>SOTA - AI 工具选型指南</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.5;
  }

  /* ── 顶栏 ── */
  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e7;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  header .update-info {
    font-size: 13px;
    color: #86868b;
  }

  /* ── 主体 ── */
  main {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 24px;
  }

  /* ── 类别区块 ── */
  .category {
    margin-bottom: 28px;
  }
  .category-title {
    font-size: 15px;
    font-weight: 600;
    color: #6e6e73;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* ── 工具卡片网格 ── */
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }

  .tool-card {
    background: #fff;
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: box-shadow 0.2s;
    border: 1px solid #e5e5e7;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .tool-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border-color: #d2d2d7;
  }

  /* 排名徽标 */
  .rank {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .rank-1 { background: #f0f0ff; color: #5856d6; }
  .rank-2 { background: #f0f0f0; color: #636366; }
  .rank-3 { background: #f0f0f0; color: #636366; }
  .rank-4 { background: #f0f0f0; color: #86868b; }

  .tool-info {
    flex: 1;
    min-width: 0;
  }
  .tool-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .tool-desc {
    font-size: 13px;
    color: #6e6e73;
    margin-bottom: 6px;
  }

  /* 标签 */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 500;
  }
  .tag-free     { background: #e8f8e8; color: #1d7d1d; }
  .tag-paid     { background: #fff3e0; color: #b36b00; }
  .tag-vpn      { background: #fce4ec; color: #c62828; }
  .tag-no-vpn   { background: #e3f2fd; color: #1565c0; }
  .tag-feature  { background: #f3e8fd; color: #7b1fa2; }

  /* 跳转箭头 */
  .arrow {
    color: #c7c7cc;
    font-size: 18px;
    flex-shrink: 0;
    align-self: center;
    transition: color 0.2s;
  }
  .tool-card:hover .arrow { color: #5856d6; }

  /* ── 底栏 ── */
  footer {
    text-align: center;
    padding: 32px 24px;
    font-size: 12px;
    color: #86868b;
  }

  /* ── 响应式 ── */
  @media (max-width: 720px) {
    .tools-grid { grid-template-columns: 1fr; }
    header { padding: 16px 20px; }
    main { padding: 0 16px; }
  }
</style>
</head>
